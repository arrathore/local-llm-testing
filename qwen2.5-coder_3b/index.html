<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAV to MP3 Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>WAV to MP3 Converter</h1>
    <input type="file" id="wavFileInput" accept=".wav">
    <button onclick="convertToMp3()">Convert to MP3</button>
    <p id="status"></p>

    <script src="converter.js"></script>

</body>
</html>
